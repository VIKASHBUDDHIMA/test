<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUESTORA'26 - Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08090C;
      --bg-card: rgba(18, 20, 29, 0.85);
      --gold-primary: #D4AF37;
      --gold-light: #F3E5AB;
      --border-glow: rgba(212, 175, 55, 0.25);
    }

    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); color: #F8FAFC; padding: 30px 20px; }

    .header-bar { max-width: 1200px; margin: 0 auto 25px; display: flex; justify-content: space-between; align-items: center; }
    h2 { font-family: 'Cinzel', serif; color: var(--gold-primary); font-size: 1.8rem; letter-spacing: 1px; }

    .refresh-btn {
      padding: 10px 22px; background: linear-gradient(135deg, #22C55E 0%, #15803D 100%);
      border: none; border-radius: 50px; color: #FFF; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3); transition: 0.3s;
    }
    .refresh-btn:hover { transform: translateY(-2px); }

    .table-container { max-width: 1200px; margin: 0 auto; background: var(--bg-card); border: 1px solid var(--border-glow); border-radius: 16px; overflow: hidden; backdrop-filter: blur(12px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.88rem; }
    th { background: rgba(212, 175, 55, 0.1); color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 0.9rem; }
    tr:hover { background: rgba(255,255,255,0.02); }

    .badge { padding: 5px 10px; border-radius: 20px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
    .pending { background: rgba(217, 119, 6, 0.2); color: #FBBF24; border: 1px solid #D97706; }
    .approved { background: rgba(22, 163, 74, 0.2); color: #4ADE80; border: 1px solid #16A34A; }

    button { padding: 8px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 0.82rem; }
    .view-btn { background: rgba(56, 189, 248, 0.15); color: #38BDF8; border: 1px solid #0284C7; }
    .approve-btn { background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%); color: #000; font-weight: 700; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
    .action-group { display: flex; gap: 8px; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 100; padding: 20px; }
    .modal-card { background: #12141D; border: 1px solid var(--gold-primary); padding: 25px; border-radius: 20px; max-width: 90%; text-align: center; box-shadow: 0 0 40px rgba(212, 175, 55, 0.2); }
    .modal img, canvas { max-width: 100%; max-height: 75vh; border-radius: 12px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>🔑 QUESTORA'26 ADMIN PORTAL</h2>
    <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Ticket ID</th>
          <th>Customer Name</th>
          <th>Phone</th>
          <th>Payment Slip</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="6" style="text-align:center;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="modal" id="slipModal" onclick="this.style.display='none'">
    <div class="modal-card"><img id="slipImg" src=""></div>
  </div>

  <div class="modal" id="ticketModal">
    <div class="modal-card">
      <h3 style="color:var(--gold-primary); font-family:'Cinzel', serif; margin-bottom:12px;">🎟️ QUESTORA'26 OFFICIAL PASS</h3>
      <canvas id="ticketCanvas"></canvas>
      <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
        <a id="downloadTicketBtn" download="QUESTORA26-Pass.png" style="padding:10px 20px; background:var(--gold-primary); color:#000; text-decoration:none; border-radius:8px; font-weight:700;">📥 Download Pass Image</a>
        <button onclick="document.getElementById('ticketModal').style.display='none'" style="background:#334155; color:#FFF;">Close</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_Y_hoCJEKTRUqsCiveJvkUfgHfpsN-ApAw00dg5XMwFieBLJ06RuSKPEbwIGIkuV2-w/exec";
    let globalData = [];

    async function loadData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Loading data...</td></tr>";

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        globalData = await res.json();

        tbody.innerHTML = "";
        globalData.forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong style="color:var(--gold-light);">${item.ticketId}</strong></td>
            <td>${item.fullName}<br><small style="color:#94A3B8">${item.email}</small></td>
            <td>${item.phone}</td>
            <td><button class="view-btn" onclick="viewSlip('${item.receiptUrl}')">📸 Slip</button></td>
            <td><span class="badge ${item.status.toLowerCase()}">${item.status}</span></td>
            <td>
              ${item.status === "Pending" ? 
                `<button class="approve-btn" id="btn-${item.rowIndex}" onclick="approveAndSendBoth(${item.rowIndex})">🚀 Approve & Send Both</button>` : 
                `<div class="action-group">
                   <button onclick="previewPass('${item.fullName}', '${item.ticketId}', '${item.qrCodeUrl}')" style="background:#0284C7; color:#fff;">👁️ View Pass</button>
                   <button onclick="resendEmail(${item.rowIndex})" style="background:#3B82F6; color:#fff;">✉️ Email</button>
                   <button onclick="resendWhatsApp('${item.phone}', '${item.fullName}', '${item.ticketId}', '${item.qrCodeUrl}')" style="background:#22C55E; color:#fff;">📲 WA</button>
                 </div>`}
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch(e) {
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#FCA5A5;'>Failed to load data. Check URL connection.</td></tr>";
      }
    }

    function viewSlip(url) {
      document.getElementById("slipImg").src = url;
      document.getElementById("slipModal").style.display = "flex";
    }

    function buildPassBase64(qrUrl) {
      return new Promise((resolve) => {
        const canvas = document.getElementById("ticketCanvas");
        const ctx = canvas.getContext("2d");

        const templateImg = new Image();
        templateImg.crossOrigin = "Anonymous";
        templateImg.src = "ticket-template.png";

        templateImg.onload = () => {
          canvas.width = templateImg.width;
          canvas.height = templateImg.height;
          ctx.drawImage(templateImg, 0, 0);

          const qrImg = new Image();
          qrImg.crossOrigin = "Anonymous";
          qrImg.src = qrUrl;

          qrImg.onload = () => {
            const qrSize = canvas.width * 0.39;
            const qrX = (canvas.width - qrSize) / 2;
            const qrY = canvas.height * 0.342;

            ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
            const dataUrl = canvas.toDataURL("image/png");
            document.getElementById("downloadTicketBtn").href = dataUrl;
            resolve(dataUrl);
          };
          qrImg.onerror = () => resolve(null);
        };
        templateImg.onerror = () => resolve(null);
      });
    }

    async function previewPass(name, ticketId, qrUrl) {
      await buildPassBase64(qrUrl);
      document.getElementById("ticketModal").style.display = "flex";
    }

    async function approveAndSendBoth(rowIndex) {
      const btn = document.getElementById(`btn-${rowIndex}`);
      const item = globalData.find(d => d.rowIndex === rowIndex);
      if(!item || !confirm(`Confirm Approval for ${item.fullName}?`)) return;

      btn.disabled = true; btn.textContent = "Processing...";

      try {
        const passImageBase64 = await buildPassBase64(item.qrCodeUrl);
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "approveBooking",
            rowIndex: rowIndex,
            passImageBase64: passImageBase64
          })
        });

        const data = await res.json();
        if(data.status === "success") {
          const msg = encodeURIComponent(`Hi ${data.name},\nYour Ticket Pass (${data.ticketId}) for QUESTORA'26 has been approved!\n\nYour Entrance QR Code:\n${data.qrCodeUrl}`);
          window.open(`https://wa.me/${data.phone}?text=${msg}`, '_blank');
          document.getElementById("ticketModal").style.display = "flex";
          loadData();
        } else {
          alert("Error: " + data.message);
        }
      } catch(err) {
        alert("Approval failed!");
      } finally {
        btn.disabled = false; btn.textContent = "🚀 Approve & Send Both";
      }
    }

    async function resendEmail(rowIndex) {
      const item = globalData.find(d => d.rowIndex === rowIndex);
      if(!item || !confirm(`Re-send Email to ${item.email}?`)) return;

      try {
        const passImageBase64 = await buildPassBase64(item.qrCodeUrl);
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "approveBooking", rowIndex: rowIndex, passImageBase64: passImageBase64 })
        });
        alert("Email re-sent with Pass attached!");
      } catch(e) { alert("Failed to send email."); }
    }

    async function resendWhatsApp(phone, name, ticketId, qrUrl) {
      const passBase64 = await buildPassBase64(qrUrl);
      if (passBase64) {
        const link = document.createElement('a');
        link.href = passBase64; link.download = `QUESTORA26_Pass_${ticketId}.png`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      }
      const msg = encodeURIComponent(`Hi ${name},\nYour Ticket Pass (${ticketId}) for QUESTORA'26 is approved!\n\nAttached is your Pass image.`);
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    loadData();
  </script>
</body>
</html>
