<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUESTORA'26 - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #fff; padding: 25px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #38bdf8; }
    .refresh-btn { padding: 8px 16px; background: #22c55e; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.88rem; }
    th { background: #0284c7; color: #fff; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; }
    .pending { background: #d97706; }
    .approved { background: #16a34a; }
    
    button { padding: 6px 12px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
    .view-btn { background: #38bdf8; color: #000; }
    .approve-btn { background: #22c55e; color: #fff; }
    .action-group { display: flex; gap: 6px; align-items: center; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
    .modal-card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 90%; text-align: center; }
    .modal img, canvas { max-width: 100%; max-height: 75vh; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>🔑 QUESTORA'26 Admin Dashboard</h2>
    <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Ticket ID</th>
        <th>Customer Name</th>
        <th>Phone</th>
        <th>Payment Slip</th>
        <th>Status</th>
        <th>Action & Re-send Options</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
    </tbody>
  </table>

  <!-- View Slip Modal -->
  <div class="modal" id="slipModal" onclick="this.style.display='none'">
    <div class="modal-card">
      <img id="slipImg" src="">
    </div>
  </div>

  <!-- Generated Pass Modal -->
  <div class="modal" id="ticketModal">
    <div class="modal-card">
      <h3 style="color:#38bdf8; margin-bottom:10px;">🎟️ QUESTORA'26 Official Pass</h3>
      <canvas id="ticketCanvas"></canvas>
      <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
        <a id="downloadTicketBtn" download="QUESTORA26-Pass.png" style="padding:10px 15px; background:#22c55e; color:#fff; text-decoration:none; border-radius:6px; font-weight:600;">📥 Download Pass Image</a>
        <button onclick="document.getElementById('ticketModal').style.display='none'" style="background:#475569; color:#fff;">Close</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx_Y_hoCJEKTRUqsCiveJvkUfgHfpsN-ApAw00dg5XMwFieBLJ06RuSKPEbwIGIkuV2-w/exec"; // 👈 ඔයාගේ Web App URL එක මෙතනට දමන්න
    let globalData = [];

    async function loadData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>Loading data...</td></tr>";

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        globalData = await res.json();

        tbody.innerHTML = "";
        globalData.forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong>${item.ticketId}</strong></td>
            <td>${item.fullName}<br><small style="color:#94a3b8">${item.email}</small></td>
            <td>${item.phone}</td>
            <td><button class="view-btn" onclick="viewSlip('${item.receiptUrl}')">📸 Slip</button></td>
            <td><span class="badge ${item.status.toLowerCase()}">${item.status}</span></td>
            <td>
              ${item.status === "Pending" ? 
                `<button class="approve-btn" id="btn-${item.rowIndex}" onclick="approveAndSendBoth(${item.rowIndex})">🚀 Approve & Send Both</button>` : 
                `<div class="action-group">
                   <button onclick="previewPass('${item.fullName}', '${item.ticketId}', '${item.qrCodeUrl}')" style="background:#0284c7; color:#fff;">👁️ Pass</button>
                   <button onclick="resendEmail(${item.rowIndex})" style="background:#3b82f6; color:#fff;">✉️ Email</button>
                   <button onclick="resendWhatsApp('${item.phone}', '${item.fullName}', '${item.ticketId}', '${item.qrCodeUrl}')" style="background:#22c55e; color:#fff;">📲 WA</button>
                 </div>`}
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch(e) {
        tbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#fca5a5;'>Failed to load data. Ensure script URL is correct.</td></tr>";
      }
    }

    function viewSlip(url) {
      document.getElementById("slipImg").src = url;
      document.getElementById("slipModal").style.display = "flex";
    }

    // Canvas Merging Helper
    function buildPassBase64(qrUrl) {
      return new Promise((resolve) => {
        const canvas = document.getElementById("ticketCanvas");
        const ctx = canvas.getContext("2d");

        const templateImg = new Image();
        templateImg.crossOrigin = "Anonymous";
        templateImg.src = "ticket-template.png";

        templateImg.onload = () => {
          canvas.width = templateImg.width;
          canvas.height = templateImg.height;
          ctx.drawImage(templateImg, 0, 0);

          const qrImg = new Image();
          qrImg.crossOrigin = "Anonymous";
          qrImg.src = qrUrl;

          qrImg.onload = () => {
            const qrSize = canvas.width * 0.39;
            const qrX = (canvas.width - qrSize) / 2;
            const qrY = canvas.height * 0.342;

            ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

            const dataUrl = canvas.toDataURL("image/png");
            document.getElementById("downloadTicketBtn").href = dataUrl;
            resolve(dataUrl);
          };
          qrImg.onerror = () => resolve(null);
        };
        templateImg.onerror = () => resolve(null);
      });
    }

    async function previewPass(name, ticketId, qrUrl) {
      await buildPassBase64(qrUrl);
      document.getElementById("ticketModal").style.display = "flex";
    }

    // 1. APPROVE & SEND TO BOTH EMAIL + WHATSAPP AUTOMATICALLY
    async function approveAndSendBoth(rowIndex) {
      const btn = document.getElementById(`btn-${rowIndex}`);
      const item = globalData.find(d => d.rowIndex === rowIndex);

      if(!item) return;
      if(!confirm(`Confirm Approval for ${item.fullName}? Pass will be emailed & WhatsApp will open.`)) return;

      btn.disabled = true;
      btn.textContent = "Processing...";

      try {
        const passImageBase64 = await buildPassBase64(item.qrCodeUrl);

        // A. Send Email in Background
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "approveBooking",
            rowIndex: rowIndex,
            passImageBase64: passImageBase64
          })
        });

        const data = await res.json();
        if(data.status === "success") {
          // B. Auto Open WhatsApp Chat in New Tab
          resendWhatsApp(data.phone, data.name, data.ticketId, data.qrCodeUrl);
          
          // C. Show Pass Preview Modal
          document.getElementById("ticketModal").style.display = "flex";
          loadData();
        } else {
          alert("Approval error: " + data.message);
        }
      } catch(err) {
        alert("Approval failed. Please try again.");
      } finally {
        btn.disabled = false;
        btn.textContent = "🚀 Approve & Send Both";
      }
    }

    // 2. RE-SEND EMAIL
    async function resendEmail(rowIndex) {
      const item = globalData.find(d => d.rowIndex === rowIndex);
      if(!item) return;
      if(!confirm(`Re-send Pass Email to ${item.email}?`)) return;

      try {
        const passImageBase64 = await buildPassBase64(item.qrCodeUrl);
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "approveBooking",
            rowIndex: rowIndex,
            passImageBase64: passImageBase64
          })
        });
        alert("Email re-sent successfully!");
      } catch(e) {
        alert("Failed to re-send Email.");
      }
    }

    // 3. RE-SEND WHATSAPP
    function resendWhatsApp(phone, name, ticketId, qrUrl) {
      const msg = encodeURIComponent(`Hi ${name},\nYour Ticket Pass (${ticketId}) for QUESTORA'26 is approved!\n\nYour Entrance QR Code:\n${qrUrl}`);
      window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
    }

    loadData();
  </script>
</body>
</html>
