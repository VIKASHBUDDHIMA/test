<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Ticket Approvals</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #fff; padding: 25px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #38bdf8; }
    .refresh-btn { padding: 8px 16px; background: #22c55e; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.88rem; }
    th { background: #0284c7; color: #fff; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; }
    .pending { background: #d97706; }
    .approved { background: #16a34a; }
    
    button { padding: 6px 12px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; }
    .view-btn { background: #38bdf8; color: #000; }
    .approve-btn { background: #22c55e; color: #fff; }
    select { padding: 6px; border-radius: 4px; background: #0f172a; color: #fff; border: 1px solid #475569; }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
    .modal-card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 90%; text-align: center; }
    .modal img, canvas { max-width: 100%; max-height: 75vh; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>🔑 Ticket Admin Dashboard</h2>
    <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Ticket ID</th>
        <th>Customer Name</th>
        <th>Phone</th>
        <th>Payment Slip</th>
        <th>Status</th>
        <th>Send Pass Via</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="7" style="text-align:center;">Loading...</td></tr>
    </tbody>
  </table>

  <!-- Modal for View Slip -->
  <div class="modal" id="slipModal" onclick="this.style.display='none'">
    <div class="modal-card">
      <img id="slipImg" src="">
    </div>
  </div>

  <!-- Modal for Generated Ticket Preview -->
  <div class="modal" id="ticketModal">
    <div class="modal-card">
      <h3 style="color:#38bdf8; margin-bottom:10px;">🎟️ Generated Pass Preview</h3>
      <canvas id="ticketCanvas"></canvas>
      <div style="margin-top:15px; display:flex; gap:10px; justify-content:center;">
        <a id="downloadTicketBtn" download="ticket-pass.png" style="padding:10px 15px; background:#22c55e; color:#fff; text-decoration:none; border-radius:6px; font-weight:600;">📥 Download Pass Image</a>
        <button onclick="document.getElementById('ticketModal').style.display='none'" style="background:#475569; color:#fff;">Close</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyHGDFiIbaXTV99V0Puxgh11kt7Jd9TEhLXGE7lb7i8NDaqP877zTXz2SF9qIGJGjTz6Q/exec"; // 👈 Paste Web App URL

    async function loadData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "<tr><td colspan='7' style='text-align:center;'>Loading data...</td></tr>";

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();

        tbody.innerHTML = "";
        data.forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong>${item.ticketId}</strong></td>
            <td>${item.fullName}<br><small style="color:#94a3b8">${item.email}</small></td>
            <td>${item.phone}</td>
            <td><button class="view-btn" onclick="viewSlip('${item.receiptUrl}')">📸 Slip</button></td>
            <td><span class="badge ${item.status.toLowerCase()}">${item.status}</span></td>
            <td>
              <select id="method-${item.rowIndex}">
                <option value="whatsapp">WhatsApp</option>
                <option value="email">Email</option>
              </select>
            </td>
            <td>
              ${item.status === "Pending" ? 
                `<button class="approve-btn" onclick="approve(${item.rowIndex})">Approve</button>` : 
                `<button onclick="generatePassCard('${item.fullName}', '${item.ticketId}', '${item.qrCodeUrl}')" style="background:#0284c7; color:#fff;">View Ticket</button>`}
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch(e) {
        tbody.innerHTML = "<tr><td colspan='7' style='text-align:center; color:#fca5a5;'>Failed to load data.</td></tr>";
      }
    }

    function viewSlip(url) {
      document.getElementById("slipImg").src = url;
      document.getElementById("slipModal").style.display = "flex";
    }

    // -------------------------------------------------------------
    // CANVAS: TEMPLATE + QR + NAME MERGING LOGIC
    // -------------------------------------------------------------
    function generatePassCard(name, ticketId, qrUrl) {
      const canvas = document.getElementById("ticketCanvas");
      const ctx = canvas.getContext("2d");

      const templateImg = new Image();
      templateImg.crossOrigin = "Anonymous";
      templateImg.src = "ticket-template.png"; // 👈 Path to your template image in GitHub

      templateImg.onload = () => {
        canvas.width = templateImg.width;
        canvas.height = templateImg.height;

        // 1. Draw Template Background
        ctx.drawImage(templateImg, 0, 0);

        // 2. Draw QR Code
        const qrImg = new Image();
        qrImg.crossOrigin = "Anonymous";
        qrImg.src = qrUrl;

        qrImg.onload = () => {
          // 🛠️ Adjust QR Position and Size here:
          const qrSize = 180;
          const qrX = canvas.width - qrSize - 50; // Right side
          const qrY = (canvas.height - qrSize) / 2; // Vertically centered

          ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

          // 3. Draw Text (Name & Ticket ID)
          ctx.fillStyle = "#FFFFFF"; // Font color
          ctx.font = "bold 28px Poppins, sans-serif";
          ctx.fillText("Name: " + name, 50, canvas.height - 90);
          
          ctx.fillStyle = "#38BDF8";
          ctx.font = "600 22px Poppins, sans-serif";
          ctx.fillText("ID: " + ticketId, 50, canvas.height - 50);

          // Enable Download Link
          const dataUrl = canvas.toDataURL("image/png");
          document.getElementById("downloadTicketBtn").href = dataUrl;
          document.getElementById("ticketModal").style.display = "flex";
        };
      };
    }

    async function approve(rowIndex) {
      const sendMethod = document.getElementById(`method-${rowIndex}`).value;
      if(!confirm(`Confirm approval and send pass via ${sendMethod.toUpperCase()}?`)) return;

      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "approveBooking",
          rowIndex: rowIndex,
          sendMethod: sendMethod
        })
      });

      const data = await res.json();
      if(data.status === "success") {
        generatePassCard(data.name, data.ticketId, data.qrCodeUrl);

        if(sendMethod === "whatsapp") {
          const msg = encodeURIComponent(`Hi ${data.name},\nYour Ticket Pass (${data.ticketId}) for School Reunion 2026 is approved!\n\nQR Pass Link: ${data.qrCodeUrl}`);
          window.open(`https://wa.me/${data.phone}?text=${msg}`, '_blank');
        } else {
          alert("Approved! Confirmation Email sent.");
        }
        loadData();
      }
    }

    loadData();
  </script>
</body>
</html>
