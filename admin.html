<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Ticket Verification</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #fff; padding: 25px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h2 { color: #38bdf8; }
    .refresh-btn { padding: 8px 16px; background: #22c55e; border: none; border-radius: 6px; color: #fff; font-weight: 600; cursor: pointer; }
    
    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 0.88rem; }
    th { background: #0284c7; color: #fff; }
    tr:hover { background: #334155; }
    
    .badge { padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; display: inline-block; }
    .pending { background: #d97706; color: #fff; }
    .approved { background: #16a34a; color: #fff; }
    
    button.view-btn { padding: 6px 12px; border: none; border-radius: 4px; background: #38bdf8; color: #000; font-weight: 600; cursor: pointer; }
    button.approve-btn { padding: 6px 12px; border: none; border-radius: 4px; background: #22c55e; color: #fff; font-weight: 600; cursor: pointer; }
    select { padding: 6px; border-radius: 4px; background: #0f172a; color: #fff; border: 1px solid #475569; }
    
    .img-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
    .img-modal img { max-width: 90%; max-height: 85vh; border-radius: 8px; border: 2px solid #38bdf8; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h2>🔑 Ticket Admin Dashboard</h2>
    <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Ticket ID</th>
        <th>Customer Name</th>
        <th>Phone</th>
        <th>Tickets / Amount</th>
        <th>Payment Slip</th>
        <th>Status</th>
        <th>Send Pass Via</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="8" style="text-align:center;">Loading records...</td></tr>
    </tbody>
  </table>

  <!-- Modal for Viewing Slip Photo -->
  <div class="img-modal" id="imgModal" onclick="this.style.display='none'">
    <img id="modalImg" src="" alt="Payment Receipt">
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2ZZpROE9G3TdT0cG2AsUyQYoCpAWBwusNl0M66PbSI2fgfytmufUEDrH4U_NbfB1V/exec"; // 👈 Paste Web App URL Here

    async function loadData() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>Loading data...</td></tr>";

      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();

        tbody.innerHTML = "";
        if(data.length === 0) {
          tbody.innerHTML = "<tr><td colspan='8' style='text-align:center;'>No bookings found yet.</td></tr>";
          return;
        }

        data.forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong>${item.ticketId}</strong></td>
            <td>${item.fullName}<br><small style="color:#94a3b8">${item.email}</small></td>
            <td>${item.phone}</td>
            <td>${item.ticketCount} Tkt(s)<br><strong style="color:#4ade80">LKR ${item.totalAmount}</strong></td>
            <td><button class="view-btn" onclick="viewSlip('${item.receiptUrl}')">📸 View Slip</button></td>
            <td><span class="badge ${item.status.toLowerCase()}">${item.status}</span></td>
            <td>
              <select id="method-${item.rowIndex}">
                <option value="email">Email</option>
                <option value="whatsapp">WhatsApp</option>
              </select>
            </td>
            <td>
              ${item.status === "Pending" ? 
                `<button class="approve-btn" onclick="approve(${item.rowIndex})">Approve</button>` : 
                `<span style="color:#4ade80; font-weight:600;">Approved</span>`}
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch(e) {
        tbody.innerHTML = "<tr><td colspan='8' style='text-align:center; color:#fca5a5;'>Failed to load data. Ensure script URL is correct.</td></tr>";
      }
    }

    function viewSlip(url) {
      document.getElementById("modalImg").src = url;
      document.getElementById("imgModal").style.display = "flex";
    }

    async function approve(rowIndex) {
      const sendMethod = document.getElementById(`method-${rowIndex}`).value;
      if(!confirm(`Confirm approval and send pass via ${sendMethod.toUpperCase()}?`)) return;

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "approveBooking",
            rowIndex: rowIndex,
            sendMethod: sendMethod
          })
        });

        const data = await res.json();
        if(data.status === "success") {
          if(sendMethod === "whatsapp") {
            const msg = encodeURIComponent(`Hi ${data.name},\nYour Ticket Pass (${data.ticketId}) for the School Reunion has been approved!\n\nYour Gate Entrance QR Code:\n${data.qrCodeUrl}`);
            window.open(`https://wa.me/${data.phone}?text=${msg}`, '_blank');
          } else {
            alert("Success! Approved and Confirmation Email Sent.");
          }
          loadData();
        }
      } catch(err) {
        alert("Approval failed!");
      }
    }

    loadData();
  </script>
</body>
</html>
