<!DOCTYPE html>
<html>
<head>
    <title>Video Gallery</title>
</head>
<body>
    <div id="videoContainer">Loading videos...</div>

    <script>
        const BOT_TOKEN = "8974378669:AAE3fxJa-OdGUi9HXiKkPu9b7SC8QeUXp4Q";
        // අලුතින් Deploy කරලා ගත්ත URL එක මෙතනට දාන්න
        const GAS_URL = "https://script.google.com/macros/s/AKfycby2_Lgl31OJQxeqE5umWcq-K4ClvaFMGlTgQseAEkcd8Csv0awRrsTTlaINBgI9unM7/exec";

        async function loadVideos() {
            const container = document.getElementById('videoContainer');
            try {
                // 1. Google Sheet එකෙන් දත්ත ගන්නවා
                const response = await fetch(GAS_URL);
                const videos = await response.json();
                
                container.innerHTML = ""; // clear loading text

                for (let v of videos) {
                    // 2. Telegram API එක හරහා fileID එකෙන් direct link එකක් ගන්නවා
                    const pathResp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${v.fileID}`);
                    const pathData = await pathResp.json();
                    
                    if (pathData.ok) {
                        const videoURL = `https://api.telegram.org/file/bot${BOT_TOKEN}/${pathData.result.file_path}`;
                        container.innerHTML += `
                            <div style="margin-bottom:20px;">
                                <h3>${v.title}</h3>
                                <video width="320" height="240" controls>
                                    <source src="${videoURL}" type="video/mp4">
                                </video>
                            </div>`;
                    }
                }
            } catch (error) {
                container.innerHTML = "Error: " + error.message;
            }
        }
        loadVideos();
    </script>
</body>
</html>
