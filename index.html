<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Direct Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 450px;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            margin-bottom: 10px;
            color: #111;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 90%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #6a11cb;
        }
        .btn {
            color: white;
            border: none;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 97%;
            transition: background 0.3s;
        }
        #getBtn {
            background: #6a11cb;
        }
        #getBtn:hover {
            background: #2575fc;
        }
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #6a11cb;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result {
            margin-top: 25px;
            display: none;
        }
        .download-btn {
            background: #00b4d8;
            width: 97%;
        }
        .download-btn:hover {
            background: #0077b6;
        }
        .download-btn:disabled {
            background: #aaaaaa;
            cursor: not-allowed;
        }
        .preview-video {
            width: 100%;
            max-height: 220px;
            border-radius: 8px;
            margin-top: 10px;
            background: #000;
        }
        .error {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Downloader</h1>
        <p>Watermark නොමැතිව වීඩියෝ කෙලින්ම Device එකටම බාගත කරගන්න</p>
        
        <input type="text" id="tiktokUrl" placeholder="TikTok වීඩියෝ ලින්ක් එක මෙතනට Paste කරන්න...">
        <button id="getBtn" class="btn" onclick="fetchVideoData()">වීඩියෝව ලබාගන්න</button>
        
        <div class="loader" id="loader"></div>
        <div class="error" id="errorMsg"></div>

        <div class="result" id="resultContainer">
            <h3 style="margin-bottom: 5px;">ඔබේ වීඩියෝව සූදානම්!</h3>
            <video id="videoPreview" class="preview-video" controls></video>
            <br>
            <button id="realDownloadBtn" class="btn download-btn" onclick="triggerDirectDownload()">කෙලින්ම Download කරගන්න</button>
        </div>
    </div>

    <script>
        let cachedVideoUrl = ''; // API එකෙන් එන link එක තියාගන්න variable එකක්

        async function fetchVideoData() {
            const urlInput = document.getElementById('tiktokUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');
            const errorMsg = document.getElementById('errorMsg');
            const videoPreview = document.getElementById('videoPreview');

            errorMsg.innerText = '';
            resultContainer.style.display = 'none';
            cachedVideoUrl = '';

            if (!urlInput) {
                errorMsg.innerText = 'කරුණාකර TikTok ලින්ක් එකක් ඇතුලත් කරන්න!';
                return;
            }

            loader.style.display = 'block';

            try {
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`;
                const response = await fetch(apiUrl);
                const result = await response.json();

                loader.style.display = 'none';

                if (result && result.data && result.data.play) {
                    cachedVideoUrl = result.data.play; // වීඩියෝ ලින්ක් එක සේව් කරගන්නවා
                    videoPreview.src = cachedVideoUrl; // Preview එකක් පෙන්වනවා
                    resultContainer.style.display = 'block';
                } else {
                    errorMsg.innerText = 'වීඩියෝව සොයාගත නොහැකි විය. ලින්ක් එක නිවැරදිදැයි බලන්න.';
                }
            } catch (error) {
                loader.style.display = 'none';
                errorMsg.innerText = 'සර්වර් සම්බන්ධතාවයේ බිඳ වැටීමක්!';
                console.error(error);
            }
        }

        // වීඩියෝව බ්‍රවුසර් එකෙන් හොරකම් කරලා කෙලින්ම ඩවුන්ලෝඩ් කරවන කොටස
        async function triggerDirectDownload() {
            if (!cachedVideoUrl) return;

            const dlBtn = document.getElementById('realDownloadBtn');
            const originalText = dlBtn.innerText;
            
            dlBtn.innerText = 'බාගත වෙමින් පවතී (Downloading...)...';
            dlBtn.disabled = true;

            try {
                // වීඩියෝ ලින්ක් එක Fetch කරලා 'Blob' (File එකක්) බවට පත් කරනවා
                const resp = await fetch(cachedVideoUrl);
                const blob = await resp.blob();
                
                // ඒ Blob එකට තාවකාලික බාගත කිරීමේ ලින්ක් එකක් හදනවා
                const dlUrl = window.URL.createObjectURL(blob);
                const tempAnchor = document.createElement('a');
                tempAnchor.href = dlUrl;
                
                // File එකට නමක් දෙනවා
                tempAnchor.download = `TikTok_Video_${Date.now()}.mp4`;
                
                // හොරෙන්ම ක්ලික් කරලා ඩවුන්ලෝඩ් එක ස්ටාර්ට් කරනවා
                document.body.appendChild(tempAnchor);
                tempAnchor.click();
                
                // අනවශ්‍ය දේවල් අයින් කිරීම
                document.body.removeChild(tempAnchor);
                window.URL.revokeObjectURL(dlUrl);
            } catch (err) {
                // යම් හෙයකින් බ්‍රවුසරය මෙය බ්ලොක් කලොත් පැරණි ක්‍රමයට වීඩියෝව ඕපන් කරයි
                window.open(cachedVideoUrl, '_blank');
                alert('කෙලින්ම බාගත කිරීමට බ්‍රවුසරයෙන් බාධා ඇති විය. වීඩියෝව ප්ලේ වන විට එය මත Long Press කර හෝ Right Click කර "Save Video As" ලබා දෙන්න.');
            } finally {
                dlBtn.innerText = originalText;
                dlBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
