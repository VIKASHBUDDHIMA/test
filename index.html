<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Hub</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .video-item { background: white; padding: 15px; border-radius: 10px; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        video { width: 100%; border-radius: 5px; margin-top: 10px; }
        #status { color: #555; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Video Uploader</h2>
        <input type="text" id="title" placeholder="Video Title">
        <input type="file" id="videoFile" accept="video/*">
        <button id="upBtn" onclick="uploadVideo()">Upload</button>
        <p id="status"></p>
    </div>

    <div id="videoContainer"></div>

    <script>
        // ඔබේ විස්තර මෙතන දාන්න
        const BOT_TOKEN = "8974378669:AAE3fxJa-OdGUi9HXiKkPu9b7SC8QeUXp4Q";
        const CHANNEL_ID = "-1003754232314";
        const GAS_URL = "https://script.google.com/macros/s/AKfycby2_Lgl31OJQxeqE5umWcq-K4ClvaFMGlTgQseAEkcd8Csv0awRrsTTlaINBgI9unM7/exec";

        async function uploadVideo() {
            const file = document.getElementById('videoFile').files[0];
            const title = document.getElementById('title').value;
            if(!file || !title) return alert("Enter Title and File");

            document.getElementById('upBtn').disabled = true;
            document.getElementById('status').innerText = "Uploading to Telegram...";

            const formData = new FormData();
            formData.append('chat_id', CHANNEL_ID);
            formData.append('video', file);

            try {
                const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                    method: 'POST', body: formData
                });
                const data = await resp.json();

                if(data.ok) {
                    document.getElementById('status').innerText = "Saving to database...";
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ title: title, fileID: data.result.video.file_id })
                    });
                    alert("Upload Success!");
                    location.reload();
                } else {
                    alert("Error: " + data.description);
                }
            } catch (err) {
                alert("Upload failed. Check console.");
                console.error(err);
            }
            document.getElementById('upBtn').disabled = false;
        }

        async function loadVideos() {
            try {
                const resp = await fetch(GAS_URL);
                const videos = await resp.json();
                const container = document.getElementById('videoContainer');
                
                for(let v of videos) {
                    const pathResp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${v.fileID}`);
                    const pathData = await pathResp.json();
                    
                    if(pathData.ok) {
                        const videoURL = `https://api.telegram.org/file/bot${BOT_TOKEN}/${pathData.result.file_path}`;
                        container.innerHTML += `
                            <div class="video-item">
                                <strong>${v.title}</strong>
                                <video src="${videoURL}" controls></video>
                            </div>`;
                    }
                }
            } catch (e) {
                console.log("Load failed:", e);
            }
        }
        loadVideos();
    </script>
</body>
</html>
