<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Uploader</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; width: 300px; text-align: center; }
        button { margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Video Uploader</h1>
        <input type="file" id="fileInput">
        <br>
        <button onclick="uploadFile()">Upload Now</button>
        <div id="status" style="margin-top: 15px; word-break: break-all;"></div>
    </div>

    <script>
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('status');
            const file = fileInput.files[0];

            if (!file) {
                status.innerText = "Please select a file first!";
                return;
            }

            status.innerText = "Uploading, please wait...";

            // Catbox API එකට අවශ්‍ය දත්ත එකතු කරගන්නවා
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.text();

                if (response.ok) {
                    status.innerHTML = `Upload successful!<br><br>Link: <br><a href="${result}" target="_blank">${result}</a>`;
                } else {
                    status.innerText = "Error: " + result;
                }
            } catch (error) {
                status.innerText = "Upload failed. Check console for details.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
