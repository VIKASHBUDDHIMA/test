<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Uploader to Catbox</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h2 { color: #333; }
        input[type="file"] { margin: 20px 0; }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #0056b3; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #555;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Video Uploader</h2>
    <input type="file" id="fileInput" accept="video/*">
    <br>
    <button onclick="uploadVideo()">Upload Now</button>
    <div id="status"></div>
</div>

<script>
    async function uploadVideo() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        
        // Google Apps Script URL එක මෙතන දාන්න
        const gasUrl = "YOUR_GAS_WEB_APP_URL_HERE"; 

        if (!fileInput.files[0]) {
            status.innerText = "Please select a video file first.";
            return;
        }

        const file = fileInput.files[0];
        status.innerText = "Uploading to Catbox... Please wait.";

        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', file);

        try {
            // 1. Upload to Catbox
            const response = await fetch('https://catbox.moe/user/api.php', {
                method: 'POST',
                body: formData
            });

            if (!response.ok) throw new Error("Upload failed.");
            
            const videoUrl = await response.text();
            
            // Show link on page
            status.innerHTML = `<strong>Upload successful!</strong><br><br>
                                Link: <a href="${videoUrl}" target="_blank">${videoUrl}</a>`;

            // 2. Send link to Google Sheet (Background)
            // Note: Google Script එකට data යවන්න පුළුවන්
            fetch(gasUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: videoUrl })
            });

        } catch (error) {
            status.innerText = "Error: " + error.message;
        }
    }
</script>

</body>
</html>
