<!DOCTYPE html>
<html>
<head>
    <title>Video Hub</title>
</head>
<body>
    <h2>Upload Video</h2>
    <input type="text" id="title" placeholder="Title">
    <input type="file" id="videoFile" accept="video/*">
    <button id="upBtn" onclick="upload()">Upload</button>
    <div id="videoContainer">Loading...</div>

    <script>
        const BOT_TOKEN = "8974378669:AAE3fxJa-OdGUi9HXiKkPu9b7SC8QeUXp4Q";
        const CHANNEL_ID = "-1003754232314";
        const GAS_URL = "https://script.google.com/macros/s/AKfycby2_Lgl31OJQxeqE5umWcq-K4ClvaFMGlTgQseAEkcd8Csv0awRrsTTlaINBgI9unM7/exec"; // මෙතනට අලුත් URL එක දාන්න!

        async function upload() {
            const file = document.getElementById('videoFile').files[0];
            const title = document.getElementById('title').value;
            const btn = document.getElementById('upBtn');
            
            btn.innerText = "Uploading...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('chat_id', CHANNEL_ID);
            formData.append('video', file);

            const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, { method: 'POST', body: formData });
            const data = await res.json();

            if (data.ok) {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ title: title, fileID: data.result.video.file_id })
                });
                alert("Success!");
                location.reload();
            } else {
                alert("Error: " + data.description);
            }
            btn.innerText = "Upload";
            btn.disabled = false;
        }

        async function load() {
            const res = await fetch(GAS_URL);
            const videos = await res.json();
            const container = document.getElementById('videoContainer');
            container.innerHTML = "";

            for (let v of videos) {
                const pathRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${v.fileID}`);
                const pathData = await pathRes.json();
                if (pathData.ok) {
                    const url = `https://api.telegram.org/file/bot${BOT_TOKEN}/${pathData.result.file_path}`;
                    container.innerHTML += `<div><h3>${v.title}</h3><video src="${url}" controls width="300"></video></div>`;
                }
            }
        }
        load();
    </script>
</body>
</html>
