<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Video Portal</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; margin-bottom: 20px; text-align: center; }
        input, button { width: 90%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #0088cc; color: white; cursor: pointer; border: none; font-weight: bold; }
        .video-list { width: 100%; max-width: 600px; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .video-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; color: #333; font-weight: bold; }
        .video-item:hover { background-color: #f0f0f0; }
        video { width: 100%; border-radius: 8px; background: #000; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Video Player (Approved Only)</h2>
    <video id="telegramVideo" controls></video>
    <p id="playerStatus">වීඩියෝවක් තෝරන්න...</p>
</div>

<div class="container">
    <h3>Suggest a New Video</h3>
    <input type="text" id="videoTitle" placeholder="Video Title එක ඇතුළත් කරන්න">
    <input type="text" id="fileId" placeholder="Telegram File ID එක ඇතුළත් කරන්න">
    <button onclick="submitVideo()">Submit for Approval</button>
    <p id="uploadStatus"></p>
</div>

<div class="video-list">
    <h3>Available Videos</h3>
    <div id="approvedContainer">Loading videos...</div>
</div>

<script>
    // ඔයාගේ තොරතුරු මෙතනට දාන්න
    const API_URL = "https://script.google.com/macros/s/AKfycbwS1aNNbiAtmUaZKkUBg-9On60AY4R9eWARuIhyBsVSwpLqEHzMh9sRzDpqIfkqEtggRA/exec"; 
    const BOT_TOKEN = "8974378669:AAE3fxJa-OdGUi9HXiKkPu9b7SC8QeUXp4Q";

    // 1. Approve කරපු වීඩියෝ ටික විතරක් ෂීට් එකෙන් ලෝඩ් කරගැනීම
    async function loadApprovedVideos() {
        try {
            const response = await fetch(`${API_URL}?action=getApproved`);
            const data = await response.json();
            const container = document.getElementById("approvedContainer");
            container.innerHTML = "";

            if(data.length === 0) {
                container.innerText = "තවම කිසිදු වීඩියෝවක් අනුමත කර නැත.";
                return;
            }

            data.forEach(video => {
                const div = document.createElement("div");
                div.className = "video-item";
                div.innerText = video.title;
                div.onclick = () => playVideo(video.fileID, video.title);
                container.appendChild(div);
            });
        } catch (error) {
            console.error(error);
        }
    }

    // 2. තෝරාගත් වීඩියෝව ප්ලේ කිරීම
    async function playVideo(fileId, title) {
        const status = document.getElementById("playerStatus");
        const video = document.getElementById("telegramVideo");
        status.innerText = `Loading: ${title}...`;

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${fileId}`);
            const data = await response.json();

            if (data.ok) {
                const filePath = data.result.file_path;
                video.src = `https://api.telegram.org/file/bot${BOT_TOKEN}/${filePath}`;
                status.innerText = `Playing: ${title}`;
                video.play();
            } else {
                status.innerText = "Error: වීඩියෝ ලින්ක් එක ලබාගත නොහැක.";
            }
        } catch (error) {
            status.innerText = "Error: Telegram සර්වර් එක සමඟ සම්බන්ධ විය නොහැක.";
        }
    }

    // 3. වීඩියෝවක් Pending ලිස්ට් එකට යැවීම
    async function submitVideo() {
        const title = document.getElementById("videoTitle").value;
        const fileId = document.getElementById("fileId").value;
        const status = document.getElementById("uploadStatus");

        if(!title || !fileId) {
            status.innerText = "කරුණාකර සියලුම විස්තර පුරවන්න.";
            return;
        }

        status.innerText = "යවමින් පවතී...";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "upload", title: title, fileID: fileId })
            });
            const result = await response.text();
            status.innerText = "සාර්ථකව ඉදිරිපත් කර ඇත! Admin අනුමත කළ පසු වෙබ් අඩවියේ දිස්වනු ඇත.";
            document.getElementById("videoTitle").value = "";
            document.getElementById("fileId").value = "";
        } catch (error) {
            status.innerText = "Error: දත්ත යැවීමට නොහැකි විය.";
        }
    }

    loadApprovedVideos();
</script>
</body>
</html>
