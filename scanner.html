<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QUESTORA'26 - Gate Scanner</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #08090C;
      --gold-primary: #D4AF37;
    }
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); color: #FFF; text-align: center; padding: 20px 15px; }

    h2 { font-family: 'Cinzel', serif; color: var(--gold-primary); font-size: clamp(1.2rem, 5vw, 1.6rem); margin-bottom: 4px; }
    p.sub { font-size: 0.8rem; color: #94A3B8; margin-bottom: 20px; }

    #reader {
      width: 100%; max-width: 360px; margin: 0 auto; border-radius: 16px; overflow: hidden;
      border: 2px solid var(--gold-primary); box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
    }

    #resultBox { margin-top: 20px; padding: 20px 15px; border-radius: 14px; display: none; }
    .valid { background: rgba(22, 101, 52, 0.95); color: #4ADE80; border: 2px solid #22C55E; }
    .used { background: rgba(153, 27, 27, 0.95); color: #FCA5A5; border: 2px solid #EF4444; }
    .invalid { background: rgba(124, 45, 18, 0.95); color: #FDBA74; border: 2px solid #F97316; }

    button { margin-top: 14px; padding: 12px 24px; background: var(--gold-primary); color: #000; border: none; border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }
  </style>
</head>
<body>

  <h2>🎟️ QUESTORA'26 SCANNER</h2>
  <p class="sub">Point camera at attendee's QR Pass</p>

  <div id="reader"></div>

  <div id="resultBox">
    <h3 id="resTitle" style="font-family:'Cinzel', serif; font-size:1.3rem;"></h3>
    <p id="resMsg" style="margin-top:6px; font-size:0.9rem;"></p>
    <p id="resName" style="font-weight:700; margin-top:8px; font-size:1.15rem; text-transform:uppercase;"></p>
    <button onclick="resetScanner()">📷 Scan Next Ticket</button>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxN5nL-zeeWNF0073H9EOwjORFqPLSP5Qn1roBABYbjIajR974C8RJkZac0o3gVQsSWcQ/exec";
    let html5QrcodeScanner;

    function onScanSuccess(decodedText) {
      if(html5QrcodeScanner) { html5QrcodeScanner.clear(); }
      verifyTicket(decodedText);
    }

    async function verifyTicket(ticketId) {
      const box = document.getElementById("resultBox");
      box.style.display = "block"; box.className = "";
      document.getElementById("resTitle").textContent = "⏳ Verifying Ticket...";
      document.getElementById("resMsg").textContent = "Pass ID: " + ticketId;
      document.getElementById("resName").textContent = "";

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({ action: "verifyTicket", ticketId: ticketId })
        });

        const data = await res.json();

        if (data.status === "valid") {
          box.className = "valid";
          document.getElementById("resTitle").textContent = "✅ VALID TICKET";
          document.getElementById("resMsg").textContent = "Entrance Allowed";
          document.getElementById("resName").textContent = "Name: " + data.name;
        } else if (data.status === "used") {
          box.className = "used";
          document.getElementById("resTitle").textContent = "⛔ ALREADY USED";
          document.getElementById("resMsg").textContent = data.message;
        } else {
          box.className = "invalid";
          document.getElementById("resTitle").textContent = "❌ INVALID PASS";
          document.getElementById("resMsg").textContent = data.message;
        }
      } catch (e) {
        box.className = "invalid";
        document.getElementById("resTitle").textContent = "⚠️ CONNECTION ERROR";
        document.getElementById("resMsg").textContent = "Check network connection.";
      }
    }

    function startScanner() {
      html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 220 });
      html5QrcodeScanner.render(onScanSuccess);
    }

    function resetScanner() {
      document.getElementById("resultBox").style.display = "none";
      startScanner();
    }

    startScanner();
  </script>
</body>
</html>
